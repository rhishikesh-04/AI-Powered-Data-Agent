name: ai-powered-data-agent

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    mem_limit: 200m
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-data-agent:
    image: ghcr.io/rhishikesh-04/ai-powered-data-agent:latest
    restart: unless-stopped
    mem_limit: 400m
    ports:
      - "127.0.0.1:8002:8000"
    env_file:
      - .env
    environment:
      host: postgres
      port: "5432"
      database: postgres
      user: postgres
      password: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - /home/ubuntu/AI-Powered-Data-Agent/data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
