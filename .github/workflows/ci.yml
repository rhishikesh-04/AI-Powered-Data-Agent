
name: AI Data Agent CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Run ETL Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run ETL tests
        run: uv run python -m pytest tests/test_etl_filter.py tests/test_etl_extract.py -v

      - name: Build Docker image
        run: docker build -t ai-data-agent:ci .


      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Tag and push Docker image to GHCR
        if: github.event_name == 'push'
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}
          docker tag ai-data-agent:ci $IMAGE:latest
          docker tag ai-data-agent:ci $IMAGE:${GITHUB_SHA}
          docker push $IMAGE:latest
          docker push $IMAGE:${GITHUB_SHA}
